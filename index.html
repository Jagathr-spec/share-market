
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jagath Market Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
}

.subtitle{
text-align:center;
color:#94a3b8;
margin-bottom:30px;
}

.search-box{
display:flex;
gap:10px;
justify-content:center;
margin-bottom:25px;
flex-wrap:wrap;
}

input{
padding:12px;
width:280px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-top:20px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.info{
margin-top:10px;
font-size:18px;
}

.green{
color:#22c55e;
font-weight:bold;
}

.red{
color:#ef4444;
font-weight:bold;
}

.yellow{
color:#facc15;
font-weight:bold;
}

canvas{
margin-top:20px;
background:white;
border-radius:10px;
padding:10px;
}

.footer{
text-align:center;
margin-top:30px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="container">

<h1>📈 Jagath Market Pro</h1>

<p class="subtitle">
Stock Analysis Dashboard
</p>

<div class="search-box">

<input
type="text"
id="stockInput"
placeholder="Example: AAPL, MSFT, TSLA"
/>

<button onclick="getStock()">
Analyze
</button>

</div>

<div class="card">

<div class="info" id="stockName"></div>
<div class="info" id="price"></div>
<div class="info" id="recommendation"></div>
<div class="info" id="risk"></div>
<div class="info" id="trend"></div>
<div class="info" id="explanation"></div>

</div>

<canvas id="myChart"></canvas>

<div class="footer">
Powered by Alpha Vantage
</div>

</div>

<script>

let chart;

async function getStock(){

const symbol =
document.getElementById("stockInput")
.value
.trim()
.toUpperCase();

if(!symbol){
alert("Enter a stock symbol");
return;
}

const apiKey =
"EB0SRDYE7LCZFHHQ";

const url =
`https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${symbol}&apikey=${apiKey}`;

try{

const response =
await fetch(url);

const data =
await response.json();

const timeSeries =
data["Time Series (Daily)"];

if(!timeSeries){

alert("Stock not found or API limit reached");

return;
}

const dates =
Object.keys(timeSeries)
.slice(0,30)
.reverse();

const prices =
dates.map(date =>
parseFloat(
timeSeries[date]["4. close"]
)
);

const latestPrice =
prices[prices.length - 1];

const avg =
prices.reduce((a,b)=>a+b,0)
/
prices.length;

const firstPrice =
prices[0];

let signal="";
let signalClass="";
let risk="";
let trend="";
let explanation="";

if(latestPrice > avg * 1.03){

signal="🟢 BUY";
signalClass="green";
risk="Medium";
trend="Bullish Uptrend";
explanation=
"Price is above recent average and showing strength.";

}

else if(latestPrice < avg * 0.97){

signal="🔴 SELL";
signalClass="red";
risk="High";
trend="Bearish Downtrend";
explanation=
"Price is below recent average and showing weakness.";

}

else{

signal="🟡 HOLD";
signalClass="yellow";
risk="Medium";
trend="Sideways";
explanation=
"Price is moving near the recent average.";

}

document.getElementById("stockName").innerHTML =
"Stock: <b>" + symbol + "</b>";

document.getElementById("price").innerHTML =
"Current Price: <b>" +
latestPrice.toFixed(2) +
"</b>";

document.getElementById("recommendation").innerHTML =
"Signal: " + signal;

document.getElementById("recommendation").className =
"info " + signalClass;

document.getElementById("risk").innerHTML =
"Risk Level: " + risk;

document.getElementById("trend").innerHTML =
"Trend: " + trend;

document.getElementById("explanation").innerHTML =
explanation;

if(chart){
chart.destroy();
}

chart =
new Chart(
document.getElementById("myChart"),
{
type:"line",
data:{
labels:dates,
datasets:[
{
label:symbol,
data:prices,
borderWidth:3,
fill:false
}
]
},
options:{
responsive:true
}
}
);

}
catch(error){

alert("Error loading stock data");

}

}

</script>

</body>
</html>
