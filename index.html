<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jagath Market Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#94a3b8;
margin-bottom:30px;
}

.search-box{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

input{
padding:15px;
width:300px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:15px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
margin-top:20px;
}

.info{
font-size:22px;
margin-bottom:12px;
}

.buy{
color:#22c55e;
font-weight:bold;
}

.sell{
color:#ef4444;
font-weight:bold;
}

.hold{
color:#f59e0b;
font-weight:bold;
}

.symbols{
text-align:center;
margin-top:15px;
color:#94a3b8;
font-size:14px;
}

canvas{
margin-top:30px;
background:white;
border-radius:10px;
padding:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 Jagath Market Pro</h1>

<div class="subtitle">
Stock Analysis Dashboard
</div>

<div class="search-box">

<input
id="stockInput"
placeholder="AAPL, TSLA, IBM, RELIANCE.BSE, TCS.BSE">

<button onclick="getStock()">
Analyze
</button>

</div>

<div class="symbols">
Examples:
AAPL | TSLA | MSFT | NVDA | IBM |
RELIANCE.BSE | TCS.BSE | INFY.BSE
</div>

<div class="card">

<div class="info" id="stockName"></div>

<div class="info" id="price"></div>

<div class="info" id="signal"></div>

<div class="info" id="risk"></div>

<div class="info" id="trend"></div>

<div class="info" id="summary"></div>

</div>

<canvas id="myChart"></canvas>

</div>

<script>

let chart;

async function getStock(){

const symbol =
document.getElementById("stockInput")
.value
.trim()
.toUpperCase();

if(symbol===""){
alert("Enter Stock Symbol");
return;
}

const apiKey =
"EB0SRDYE7LCZFHHQ";

const url =
`https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${symbol}&apikey=${apiKey}`;

try{

const response =
await fetch(url);

const data =
await response.json();

const series =
data["Time Series (Daily)"];

if(!series){
alert("Stock not found");
return;
}

const dates =
Object.keys(series)
.slice(0,30)
.reverse();

const prices =
dates.map(d =>
parseFloat(
series[d]["4. close"]
)
);

const latest =
prices[prices.length-1];

const average =
prices.reduce((a,b)=>a+b,0)
/ prices.length;

let signal="";
let signalClass="";
let risk="";
let trend="";
let summary="";

if(latest > average * 1.02){

signal="🟢 BUY";
signalClass="buy";
risk="Medium";
trend="Bullish Uptrend";
summary=
"Price is above recent average and showing strength.";

}
else if(latest < average * 0.98){

signal="🔴 SELL";
signalClass="sell";
risk="High";
trend="Bearish Downtrend";
summary=
"Price is below recent average and showing weakness.";

}
else{

signal="🟡 HOLD";
signalClass="hold";
risk="Low-Medium";
trend="Sideways";
summary=
"Price is near average. Wait for confirmation.";

}

document.getElementById("stockName")
.innerHTML =
"Stock: <b>"+symbol+"</b>";

document.getElementById("price")
.innerHTML =
"Current Price: <b>"+latest.toFixed(2)+"</b>";

document.getElementById("signal")
.innerHTML =
"Signal: <span class='"+signalClass+"'>"+signal+"</span>";

document.getElementById("risk")
.innerHTML =
"Risk Level: "+risk;

document.getElementById("trend")
.innerHTML =
"Trend: "+trend;

document.getElementById("summary")
.innerHTML =
summary;

if(chart){
chart.destroy();
}

chart =
new Chart(
document.getElementById("myChart"),
{
type:"line",

data:{
labels:dates,

datasets:[
{
label:symbol,
data:prices,
borderWidth:3,
fill:false
}
]
},

options:{
responsive:true
}
}
);

}
catch(error){

alert("Error loading data");

}

}

</script>

</body>
</html>
