<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Stock Helper Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#38bdf8;
}

.search-box{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
}

input{
    width:300px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0ea5e9;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

.info{
    margin:10px 0;
    font-size:18px;
}

.buy{
    color:#22c55e;
    font-weight:bold;
}

.sell{
    color:#ef4444;
    font-weight:bold;
}

.hold{
    color:#facc15;
    font-weight:bold;
}

canvas{
    background:white;
    border-radius:10px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 AI Stock Helper Pro</h1>

<div class="search-box">
<input id="stockInput" placeholder="Example: AAPL, TSLA, IBM">
<button onclick="getStock()">Analyze</button>
</div>

<div class="card">

<h2 id="stockName">Stock Analysis</h2>

<div class="info" id="price"></div>
<div class="info" id="signal"></div>
<div class="info" id="risk"></div>
<div class="info" id="trend"></div>

</div>

<canvas id="chart"></canvas>

</div>

<script>

let myChart;

async function getStock(){

const symbol=document.getElementById("stockInput").value.trim();

if(!symbol){
alert("Enter stock symbol");
return;
}

const apiKey="EB0SRDYE7LCZFHHQ";

const url=
`https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${symbol}&apikey=${apiKey}`;

try{

const response=await fetch(url);
const data=await response.json();

const series=data["Time Series (Daily)"];

if(!series){
alert("Stock not found or API limit reached.");
return;
}

const dates=Object.keys(series).slice(0,15).reverse();

const prices=dates.map(d =>
parseFloat(series[d]["4. close"])
);

const latest=prices[prices.length-1];
const first=prices[0];

document.getElementById("stockName").innerText=symbol.toUpperCase();

document.getElementById("price").innerHTML=
"Current Price: <b>$"+latest.toFixed(2)+"</b>";

let signal="";
let risk="";
let trend="";

const change=((latest-first)/first)*100;

if(change>5){
signal='<span class="buy">🟢 BUY</span>';
risk='Risk: Medium';
trend='Trend: Strong Uptrend';
}
else if(change<-5){
signal='<span class="sell">🔴 SELL</span>';
risk='Risk: High';
trend='Trend: Downtrend';
}
else{
signal='<span class="hold">🟡 HOLD</span>';
risk='Risk: Low';
trend='Trend: Sideways';
}

document.getElementById("signal").innerHTML=signal;
document.getElementById("risk").innerHTML=risk;
document.getElementById("trend").innerHTML=trend;

if(myChart){
myChart.destroy();
}

myChart=new Chart(
document.getElementById("chart"),
{
type:"line",
data:{
labels:dates,
datasets:[{
label:symbol.toUpperCase(),
data:prices,
borderWidth:3
}]
},
options:{
responsive:true
}
}
);

}
catch(error){
alert("Error loading data");
}

}
</script>

</body>
</html>
